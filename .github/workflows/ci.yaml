name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }} / Symfony ${{ matrix.symfony }} (${{ matrix.dependencies }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.3'
            symfony: '7.3.*'
            dependencies: lowest
          - php: '8.3'
            symfony: '7.4.*'
            dependencies: stable
          - php: '8.4'
            symfony: '8.0.*'
            dependencies: stable
          - php: '8.5'
            symfony: '8.1.*'
            dependencies: stable
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ctype, dom, iconv, intl, json, mbstring, pdo_sqlite, tokenizer, xml, xmlwriter
          coverage: none
      - name: Select Symfony ${{ matrix.symfony }}
        run: >-
          composer require --no-update
          "symfony/asset-mapper:${{ matrix.symfony }}"
          "symfony/filesystem:${{ matrix.symfony }}"
          "symfony/framework-bundle:${{ matrix.symfony }}"
          "symfony/http-client:${{ matrix.symfony }}"
          "symfony/string:${{ matrix.symfony }}"
          "symfony/translation:${{ matrix.symfony }}"
          "symfony/twig-bundle:${{ matrix.symfony }}"
          "symfony/validator:${{ matrix.symfony }}"
          "symfony/yaml:${{ matrix.symfony }}"
      - name: Align transitive Symfony components
        run: >-
          composer require --dev --no-update
          "symfony/browser-kit:${{ matrix.symfony }}"
          "symfony/cache:${{ matrix.symfony }}"
          "symfony/config:${{ matrix.symfony }}"
          "symfony/console:${{ matrix.symfony }}"
          "symfony/css-selector:${{ matrix.symfony }}"
          "symfony/dependency-injection:${{ matrix.symfony }}"
          "symfony/doctrine-bridge:${{ matrix.symfony }}"
          "symfony/dom-crawler:${{ matrix.symfony }}"
          "symfony/error-handler:${{ matrix.symfony }}"
          "symfony/event-dispatcher:${{ matrix.symfony }}"
          "symfony/finder:${{ matrix.symfony }}"
          "symfony/http-foundation:${{ matrix.symfony }}"
          "symfony/http-kernel:${{ matrix.symfony }}"
          "symfony/options-resolver:${{ matrix.symfony }}"
          "symfony/phpunit-bridge:${{ matrix.symfony }}"
          "symfony/process:${{ matrix.symfony }}"
          "symfony/routing:${{ matrix.symfony }}"
          "symfony/stopwatch:${{ matrix.symfony }}"
          "symfony/twig-bridge:${{ matrix.symfony }}"
          "symfony/var-dumper:${{ matrix.symfony }}"
          "symfony/var-exporter:${{ matrix.symfony }}"
      - name: Validate Composer metadata
        run: composer validate --strict --no-check-publish
      - name: Prepare legacy compatibility set
        if: matrix.dependencies == 'lowest'
        run: composer remove --dev --no-update roave/security-advisories
      - name: Install lowest dependencies
        if: matrix.dependencies == 'lowest'
        run: composer update --prefer-lowest --prefer-stable --with-all-dependencies --no-interaction --no-progress --no-blocking
      - name: Install stable dependencies
        if: matrix.dependencies == 'stable'
        run: composer update --prefer-stable --with-all-dependencies --no-interaction --no-progress
      - name: Audit stable dependencies
        if: matrix.dependencies == 'stable'
        run: composer audit
      - name: Run PHPUnit
        run: composer test
      - name: Run PHPStan
        run: composer phpstan
      - name: Check PHP coding standards
        run: composer cs-check

  javascript:
    name: JavaScript (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
    defaults:
      run:
        working-directory: assets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm run lint
      - run: npm test
